<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kipakosa AR Viewer</title>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (id) {
        window.location.replace('/ar?id=' + encodeURIComponent(id));
      } else {
        window.location.replace('/landing.html');
      }
    })();
  </script>
</head>
<body style="background:#090d16;color:#fff;font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
  <p style="opacity:0.7">Redirecting to AR experience...</p>
</body>
</html>
