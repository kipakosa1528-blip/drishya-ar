<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Projects — Kipakosa AR</title>
  <link rel="stylesheet" href="css/app.css?v=4" />
  <script src="js/admin-boot.js?v=1"></script>
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg?v=1" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=1" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=1" /></head>
<body>
<div class="mobile-topbar">
  <div class="brand"><img src="/assets/logo.svg" style="width:24px;height:24px;border-radius:6px;margin-right:8px;vertical-align:middle" />Kipakosa <span>AR</span></div>
  <button class="btn btn-sm btn-default logout-btn">Logout</button>
</div>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-brand" style="display:flex;align-items:center;gap:10px">
      <img src="/assets/logo.svg" style="width:28px;height:28px;border-radius:6px" />
      <div>Kipakosa <span>AR</span></div>
    </div>

    <a class="nav-link" data-page="dashboard" href="dashboard.html">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Dashboard
    </a>
    <a class="nav-link" data-page="projects" href="projects.html">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg>
      Projects
    </a>
    <a class="nav-link" data-page="create" href="create.html">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      New Project
    </a>
    <div class="sidebar-footer">
      <button class="btn btn-sm btn-default" id="logout-btn" style="width:100%">Logout</button>
    </div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div class="page-title">Projects <span id="count" style="font-size:13px;font-weight:400;color:var(--muted)"></span></div>
      <a href="create.html" class="btn btn-primary">+ New Project</a>
    </div>

    <div class="filter-bar">
      <input class="form-control" type="text" id="search" placeholder="Search name, client or notes…" />
      <div class="seg-ctrl">
        <button class="seg-btn active" data-f="all">All</button>
        <button class="seg-btn" data-f="active">Active</button>
        <button class="seg-btn" data-f="expired">Expired</button>
        <button class="seg-btn" data-f="soon">Expiring</button>
      </div>
      <select class="form-control f-select" id="f-type" title="Expiration type">
        <option value="all">All types</option>
        <option value="permanent">Permanent</option>
        <option value="time">Time-based</option>
        <option value="scans">Scan limit</option>
        <option value="both">Date + scans</option>
      </select>
      <select class="form-control f-select" id="f-client" title="Filter by client">
        <option value="all">All clients</option>
      </select>
      <select class="form-control f-select" id="f-usage" title="Scan usage">
        <option value="all">Any usage</option>
        <option value="never">Never scanned</option>
        <option value="has">Has scans</option>
        <option value="near">Near limit (80%+)</option>
      </select>
      <input type="date" class="form-control f-select" id="f-from" title="Created from" />
      <input type="date" class="form-control f-select" id="f-to" title="Created to" />
      <select class="form-control f-select" id="f-sort" title="Sort order">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="scans_desc">Most scans</option>
        <option value="scans_asc">Fewest scans</option>
        <option value="name_asc">Name A–Z</option>
        <option value="expiring">Expiring soonest</option>
        <option value="recent_scan">Recently scanned</option>
      </select>
      <button class="btn btn-sm btn-default filter-clear" id="f-reset" style="display:none">Clear ✕</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:70px">Image</th>
            <th>Project</th>
            <th>Client</th>
            <th>Scans</th>
            <th>Status</th>
            <th>Expires</th>
            <th style="text-align:right;width:140px">Actions</th>
          </tr>
        </thead>
<tbody id="proj-body"></tbody>
      </table>
    </div>

    <script>
      (function () {
        var list = KBoot.readCache();
        var body = document.getElementById('proj-body');
        if (!list) { body.innerHTML = KBoot.skeletonRows(5); return; }
        var sorted = list.slice().sort(KBoot.byCreatedDesc);
        document.getElementById('count').textContent = '(' + sorted.length + ')';
        body.innerHTML = sorted.length ? sorted.map(KBoot.rowHTML).join('')
          : '<tr><td colspan="7" class="empty">No projects yet. <a href="create.html" style="color:var(--accent);font-weight:600">Create one</a></td></tr>';
      })();
    </script>
  </main>
</div>

<script type="module">
  import { requireAuth, initNav } from './js/auth.js?v=4';
  import { getAllProjects, deleteProject } from './js/db.js?v=4';
  import { fmt, statusBadge, toast, filterProjects, sortProjects } from './js/utils.js?v=4';

  requireAuth(); 
  initNav('projects');

  const DEFAULTS = { search: '', status: 'all', type: 'all', client: 'all', usage: 'all', sort: 'newest', from: '', to: '' };
  let state = { ...DEFAULTS };
  let all = [];

  // Restore filters from the URL (?q=&status=&type=&client=&usage=&from=&to=&sort=)
  (function initState() {
    const sp = new URLSearchParams(location.search);
    if (sp.has('q')) state.search = sp.get('q');
    for (const key of ['status', 'type', 'client', 'usage', 'sort', 'from', 'to']) {
      const v = sp.get(key);
      if (v) state[key] = v;
    }
    // Reflect into controls; fall back to defaults for unknown values
    document.getElementById('search').value = state.search;
    const segBtn = document.querySelector(`.seg-btn[data-f="${state.status}"]`);
    if (segBtn) {
      document.querySelectorAll('.seg-btn').forEach(x => x.classList.remove('active'));
      segBtn.classList.add('active');
    } else {
      state.status = 'all';
    }
    for (const [id, key] of [['f-type', 'type'], ['f-usage', 'usage'], ['f-sort', 'sort']]) {
      const el = document.getElementById(id);
      if ([...el.options].some(o => o.value === state[key])) el.value = state[key];
      else state[key] = DEFAULTS[key];
    }
    document.getElementById('f-from').value = state.from;
    document.getElementById('f-to').value = state.to;
  })();

  function syncUrl() {
    const sp = new URLSearchParams();
    for (const key of Object.keys(DEFAULTS)) {
      if (state[key] !== DEFAULTS[key]) sp.set(key === 'search' ? 'q' : key, state[key]);
    }
    const qs = sp.toString();
    history.replaceState(null, '', location.pathname + (qs ? '?' + qs : ''));
    const dirty = Object.keys(DEFAULTS).some(k => state[k] !== DEFAULTS[k]);
    document.getElementById('f-reset').style.display = dirty ? '' : 'none';
  }

  function applyAndRender() { syncUrl(); renderTable(); }

  function rebuildClientOptions() {
    const sel = document.getElementById('f-client');
    const clients = [...new Set(all.map(p => String(p.client || '').trim()).filter(Boolean))]
      .sort((a, b) => a.localeCompare(b));
    sel.innerHTML = '<option value="all">All clients</option>' +
      clients.map(c => `<option value="${c.replace(/"/g, '&quot;')}">${c}</option>`).join('');
    if ([...sel.options].some(o => o.value === state.client)) sel.value = state.client;
    else state.client = 'all';
  }

  function setProjectsList(list) {
    all = list || [];
    rebuildClientOptions();
    renderTable();
  }

  const initial = await getAllProjects((freshList) => {
    setProjectsList(freshList);
  });
  setProjectsList(initial);

  document.getElementById('search').addEventListener('input', e => { state.search = e.target.value; applyAndRender(); });
  document.querySelectorAll('.seg-btn').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.seg-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); state.status = b.dataset.f; applyAndRender();
  }));
  for (const [id, key] of [['f-type', 'type'], ['f-client', 'client'], ['f-usage', 'usage'], ['f-sort', 'sort']]) {
    document.getElementById(id).addEventListener('change', e => { state[key] = e.target.value; applyAndRender(); });
  }
  for (const [id, key] of [['f-from', 'from'], ['f-to', 'to']]) {
    document.getElementById(id).addEventListener('change', e => { state[key] = e.target.value; applyAndRender(); });
  }
  document.getElementById('f-reset').addEventListener('click', () => {
    state = { ...DEFAULTS };
    document.getElementById('search').value = '';
    document.querySelectorAll('.seg-btn').forEach(x => x.classList.toggle('active', x.dataset.f === 'all'));
    for (const id of ['f-type', 'f-client', 'f-usage', 'f-sort']) document.getElementById(id).value = document.getElementById(id).options[0].value;
    document.getElementById('f-from').value = '';
    document.getElementById('f-to').value = '';
    syncUrl(); renderTable();
  });

  function renderTable() {
    const data = sortProjects(filterProjects(all, state), state.sort);

    document.getElementById('count').textContent = `(${data.length})`;
    const body = document.getElementById('proj-body');
    if (!data.length) {
      body.innerHTML = `<tr><td colspan="7" class="empty">${all.length ? 'No matching projects found' : 'No projects yet. <a href="create.html" style="color:var(--accent);font-weight:600">Create one</a>'}</td></tr>`;
      return;
    }
    body.innerHTML = data.map(p => `
      <tr>
        <td style="width:70px">
          ${p.imageUrl ? `<img class="td-thumb" src="${p.imageUrl}" />` : `<div class="td-thumb-placeholder"></div>`}
        </td>
        <td><a href="project.html?id=${p.id}" style="font-weight:600;color:var(--text)">${p.name}</a></td>
        <td style="color:var(--text-secondary)">${p.client || '—'}</td>
        <td><span style="display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--accent)"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> ${p.viewsCount || p.views_count || 0}</span></td>
        <td>${statusBadge(p)}</td>
        <td style="color:var(--text-secondary)">${fmt(p.expiresAt || p.expires_at)}</td>

        <td style="text-align:right">
          <div class="actions" style="display:flex;gap:6px;justify-content:flex-end">
            <a href="project.html?id=${p.id}" class="btn btn-sm btn-default">View</a>
            <button class="btn btn-sm btn-danger" onclick="delProj('${p.id}', '${p.name.replace(/'/g, "\\'")}')">Delete</button>
          </div>
        </td>
      </tr>`).join('');
  }


  window.delProj = async function(id, name) {
    if (confirm(`Delete "${name}"?`)) {
      await deleteProject(id);
      all = all.filter(p => p.id !== id);
      renderTable();
      toast('Project deleted', 'success');
    }
  };
</script>

</body>
</html>
