<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Project Detail — Kipakosa AR</title>
  <link rel="stylesheet" href="css/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.6.0/lib/qr-code-styling.js"></script>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-brand">Kipakosa <span>AR</span></div>

    <a class="nav-link" data-page="dashboard" href="dashboard.html">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Dashboard
    </a>
    <a class="nav-link" data-page="projects" href="projects.html">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg>
      Projects
    </a>
    <a class="nav-link" data-page="create" href="create.html">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      New Project
    </a>
    <div class="sidebar-footer">
      <button class="btn btn-sm btn-default" id="logout-btn" style="width:100%">Logout</button>
    </div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div>
        <a href="projects.html" style="font-size:12px;color:var(--muted)">← Projects</a>
        <div class="page-title" id="p-title" style="margin-top:2px">Loading...</div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-default btn-sm" id="edit-btn">Edit</button>
        <button class="btn btn-danger btn-sm" id="del-btn">Delete Project</button>
      </div>
    </div>

    <div id="detail-grid" style="display:grid;grid-template-columns:1fr 340px;gap:24px;display:none">
      <!-- Left: Assets & Meta -->
      <div style="display:flex;flex-direction:column;gap:20px">
        <div class="panel">
          <div class="panel-title">Asset Previews</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
            <div>
              <div style="font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:6px">Target Image</div>
              <img id="preview-img" style="width:100%;max-height:220px;object-fit:contain;background:#000;border-radius:6px;border:1px solid var(--border)" />
            </div>
            <div>
              <div style="font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:6px">Overlay Video</div>
              <video id="preview-vid" controls style="width:100%;max-height:220px;background:#000;border-radius:6px;border:1px solid var(--border)"></video>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-title">Project Details</div>
          <table style="width:100%;font-size:13px;border-collapse:collapse">
            <tr><td style="color:var(--muted);padding:6px 0;width:120px">Status</td><td id="p-status"></td></tr>
            <tr><td style="color:var(--muted);padding:6px 0">Client</td><td id="p-client"></td></tr>
            <tr><td style="color:var(--muted);padding:6px 0">Expires</td><td id="p-expiry"></td></tr>
            <tr><td style="color:var(--muted);padding:6px 0">Created</td><td id="p-created"></td></tr>
            <tr id="notes-row" style="display:none"><td style="color:var(--muted);padding:6px 0">Notes</td><td id="p-notes"></td></tr>
          </table>
        </div>
      </div>

      <!-- Right: QR & Share Link -->
      <div style="display:flex;flex-direction:column;gap:20px">
        <div class="panel">
          <div class="panel-title">AR Link & QR Code</div>
          <div style="text-align:center;margin-bottom:16px">
            <div class="qr-box" id="qr-out"></div>
            <button class="btn btn-default btn-sm" style="width:100%;margin-top:10px" id="dl-qr">Download QR Code</button>
          </div>
          <div class="form-group" style="margin-bottom:12px">
            <label>Public AR Link</label>
            <div class="copy-row">
              <input class="form-control" id="ar-link" readonly />
              <button class="btn btn-default btn-sm" id="copy-link">Copy</button>
            </div>
          </div>
          <a id="open-ar" href="#" target="_blank" class="btn btn-primary" style="width:100%">Open AR Viewer ↗</a>
        </div>
      </div>
    </div>

    <!-- Edit Form Panel (Hidden by default) -->
    <div id="edit-panel" class="panel" style="max-width:520px;display:none;margin-top:20px">
      <div class="panel-title">Edit Project Details</div>
      <div class="form-group">
        <label>Project Name</label>
        <input class="form-control" type="text" id="e-name" />
      </div>
      <div class="form-group">
        <label>Client Name</label>
        <input class="form-control" type="text" id="e-client" />
      </div>
      <div class="form-group">
        <label>Expiry Date</label>
        <input class="form-control" type="date" id="e-expiry" />
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary btn-sm" id="save-edit-btn">Save Changes</button>
        <button class="btn btn-default btn-sm" id="cancel-edit-btn">Cancel</button>
      </div>
    </div>

    <div id="not-found" style="display:none" class="empty">Project not found. <a href="projects.html">Back to projects</a></div>
  </main>
</div>

<script type="module">
  import { requireAuth, initNav } from './js/auth.js?v=2';
  import { getProject, saveProjectWithFiles, deleteProject, deleteFiles } from './js/db.js?v=2';
  import { fmt, isExpired, statusBadge, arUrl, toast, generateQR, downloadQR, copyText } from './js/utils.js?v=2';

  requireAuth(); 
  initNav('projects');

  const id = new URLSearchParams(location.search).get('id');
  if (!id) location.replace('/projects.html');

  let project = await getProject(id);
  if (!project) {
    document.getElementById('not-found').style.display = '';
  } else {
    render();
  }

  function render() {
    document.getElementById('p-title').textContent    = project.name;
    document.getElementById('p-status').innerHTML     = statusBadge(project.expiresAt);
    document.getElementById('p-client').textContent   = project.client || '—';
    document.getElementById('p-expiry').textContent   = fmt(project.expiresAt);
    document.getElementById('p-created').textContent  = fmt(project.createdAt);
    if (project.notes) {
      document.getElementById('p-notes').textContent = project.notes;
      document.getElementById('notes-row').style.display = '';
    }

    const url = arUrl(id);
    document.getElementById('ar-link').value = url;
    document.getElementById('open-ar').href  = url;
    generateQR(url, document.getElementById('qr-out'), 160);
    document.getElementById('dl-qr').onclick   = () => downloadQR(url, `qr-${id}`);
    document.getElementById('copy-link').onclick = () => copyText(url);

    if (project.imageUrl) document.getElementById('preview-img').src = project.imageUrl;
    if (project.videoUrl) document.getElementById('preview-vid').src = project.videoUrl;

    document.getElementById('detail-grid').style.display = '';
  }

  document.getElementById('del-btn').onclick = async () => {
    if (confirm(`Delete project "${project.name}"?`)) {
      await deleteProject(id);
      await deleteFiles(id);
      toast('Project deleted');
      location.replace('/projects.html');
    }
  };

  document.getElementById('edit-btn').onclick = () => {
    document.getElementById('e-name').value = project.name;
    document.getElementById('e-client').value = project.client || '';
    document.getElementById('e-expiry').value = project.expiresAt ? project.expiresAt.split('T')[0] : '';
    document.getElementById('edit-panel').style.display = 'block';
  };

  document.getElementById('save-edit-btn').onclick = async () => {

    const name = document.getElementById('e-name').value.trim();
    const client = document.getElementById('e-client').value.trim();
    const expVal = document.getElementById('e-expiry').value;
    if (!name) { toast('Please enter a project name', 'err'); return; }

    try {
      const resp = await fetch(`/api/projects/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name, client,
          expiresAt: expVal ? new Date(expVal + 'T23:59:59').toISOString() : null
        })
      });
      if (!resp.ok) throw new Error(await resp.text());
      project = await resp.json();
      render();
      document.getElementById('edit-panel').style.display = 'none';
      toast('Project updated successfully!', 'success');
    } catch (err) {
      toast('Update failed: ' + err.message, 'err');
    }
  };

  document.getElementById('cancel-edit-btn').onclick = () => {
    document.getElementById('edit-panel').style.display = 'none';
  };
</script>
</body>
</html>
