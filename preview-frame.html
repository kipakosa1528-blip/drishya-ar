<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Appu Living Frame — Tabletop WebAR | Kipakosa</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg?v=1">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=1">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=1">

  <!-- A-Frame & 8th Wall SLAM Engine -->
  <script crossorigin="anonymous" src="/external/8frame-1.5.0.min.js"></script>
  <script src="/external/xr/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
  <script defer src="/external/xrextras.js" crossorigin="anonymous"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      background: #08090c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .a-enter-vr, .a-enter-vr-button { display: none !important; }

    /* Suppress 8th Wall branding logos */
    .poweredby, .powered-by, .poweredby-8thwall, .xrextras-powered-by,
    .xrextras-loading-footer, .loading-footer, #poweredBy8thWall, #poweredby,
    [id*="poweredBy" i], [class*="poweredBy" i], [class*="powered-by" i] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* Kipakosa Watermark Badge */
    #ar-watermark {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 9px;
      background: rgba(9, 13, 22, 0.84);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 7px 16px 7px 10px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.55);
      pointer-events: none;
    }
    #ar-watermark img {
      width: 22px;
      height: 22px;
      object-fit: contain;
    }
    #ar-watermark span {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #f8fafc;
      text-transform: uppercase;
    }
    #ar-watermark span span {
      color: #c9a96e;
      font-size: 10px;
      font-weight: 800;
      margin-left: 3px;
    }

    /* Top Action Bar */
    #top-actions {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-pill {
      background: rgba(9, 13, 22, 0.84);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 7px 14px;
      border-radius: 9999px;
      border: 1px solid rgba(201, 169, 110, 0.45);
      color: #f5f5f7;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      touch-action: manipulation;
    }
    .header-pill.muted {
      color: rgba(255, 255, 255, 0.6);
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Branded AR Camera Starting Overlay */
    #camera-loading {
      position: fixed;
      inset: 0;
      z-index: 5000;
      background: #08090c;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: opacity 0.4s ease;
    }
    #camera-loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .camera-pulse-ring {
      width: 54px;
      height: 54px;
      border: 2px solid rgba(201, 169, 110, 0.3);
      border-top-color: #c9a96e;
      border-radius: 50%;
      animation: cam-spin 1s linear infinite;
    }
    @keyframes cam-spin {
      to { transform: rotate(360deg); }
    }
    .camera-loading-text {
      color: #f5f5f7;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    /* Surface Aim & Placement Instructions */
    #placement-overlay {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      pointer-events: none;
      transition: opacity 0.35s ease, transform 0.35s ease;
      width: 90%;
      max-width: 360px;
      text-align: center;
    }
    #placement-overlay.placed {
      opacity: 0;
      transform: translateX(-50%) translateY(20px);
      pointer-events: none;
    }
    .instruction-card {
      background: rgba(9, 13, 22, 0.90);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(201, 169, 110, 0.55);
      border-radius: 20px;
      padding: 14px 22px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.65);
      color: #f8fafc;
    }
    .instruction-title {
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin: 0 0 4px 0;
      color: #f5f5f7;
    }
    .instruction-sub {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.72);
      margin: 0;
      line-height: 1.45;
    }

    /* Single Clean Reposition Pill */
    #placed-controls {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }
    .ar-reposition-btn {
      background: rgba(9, 13, 22, 0.90);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(201, 169, 110, 0.55);
      color: #f5f5f7;
      padding: 10px 24px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      gap: 7px;
      touch-action: manipulation;
      transition: background 0.2s, transform 0.15s;
    }
    .ar-reposition-btn:active {
      transform: scale(0.96);
      background: rgba(201, 169, 110, 0.25);
    }
  </style>

  <script>
    // ── Official 8th Wall Ground Raycasting & Tabletop Placement Component ──
    AFRAME.registerComponent('tabletop-living-frame', {
      schema: {
        modelSrc: { default: '/assets/models/appu_photoframe.glb' },
        videoSrc: { default: 'https://pub-f2ad2c43aa344d4bb911e991b04b1fbd.r2.dev/3d4c1b30-0cdb-45af-9d00-07f119f3bb10/optimized.mp4' },
        targetPhoto: { default: '/assets/demo-target-appu.jpg' },
        modelRotationY: { default: 90 }
      },

      init: function() {
        this.placed = false;
        this.isMuted = false;
        this.modelLoaded = false;

        // Container holding the living frame and shadow
        this.frameGroup = this.el.object3D;
        this.frameGroup.visible = false;
        this.frameGroup.position.set(0, 0, 0);

        // Reticle entity
        this.reticleEl = document.getElementById('ground-reticle');

        // Video texture setup
        this.initVideoTexture();

        // Load 3D GLTF Model and normalize pivot so base sits at y = 0
        this.loadModel();

        // Listen for raycaster clicks on the ground plane
        const groundEl = document.getElementById('ground');
        if (groundEl) {
          groundEl.addEventListener('click', (e) => this.onGroundClick(e));
        }

        // Camera startup dismissal
        this.setupStartupDismissal();
      },

      setupStartupDismissal: function() {
        const dismissLoader = () => {
          const l = document.getElementById('camera-loading');
          if (l) l.classList.add('hidden');
          const oldLoaders = document.querySelectorAll('#loadingContainer, .xrextras-loading, #loadBackground');
          oldLoaders.forEach(el => {
            el.style.display = 'none';
          });
        };

        const scene = this.el.sceneEl;
        if (scene) {
          scene.addEventListener('realityready', dismissLoader);
          scene.addEventListener('loaded', () => setTimeout(dismissLoader, 1000));
        }
        window.addEventListener('xrframestart', dismissLoader, { once: true });
        setTimeout(dismissLoader, 3500);
      },

      initVideoTexture: function() {
        this.video = document.createElement('video');
        this.video.src = this.data.videoSrc;
        this.video.crossOrigin = 'anonymous';
        this.video.loop = true;
        this.video.playsInline = true;
        this.video.webkitPlaysInline = true;
        this.video.preload = 'auto';
        this.video.muted = false; // Unmuted on tap

        this.videoTexture = new THREE.VideoTexture(this.video);
        this.videoTexture.minFilter = THREE.LinearFilter;
        this.videoTexture.magFilter = THREE.LinearFilter;
        this.videoTexture.format = THREE.RGBAFormat;
        if (THREE.SRGBColorSpace) {
          this.videoTexture.colorSpace = THREE.SRGBColorSpace;
        } else if (THREE.sRGBEncoding) {
          this.videoTexture.encoding = THREE.sRGBEncoding;
        }

        this.photoTexture = new THREE.TextureLoader().load(this.data.targetPhoto);
        if (THREE.SRGBColorSpace) {
          this.photoTexture.colorSpace = THREE.SRGBColorSpace;
        } else if (THREE.sRGBEncoding) {
          this.photoTexture.encoding = THREE.sRGBEncoding;
        }
      },

      loadModel: function() {
        const loader = new THREE.GLTFLoader();
        loader.load(this.data.modelSrc, (gltf) => {
          const model = gltf.scene;

          // Pivot container
          this.modelPivot = new THREE.Group();

          // Apply configurable model yaw rotation (default 90° for appu_photoframe)
          const yawDeg = Number(this.data.modelRotationY) || 0;
          model.rotation.y = yawDeg * (Math.PI / 180);

          // Traverse meshes and setup materials
          model.traverse((child) => {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;

              const mats = Array.isArray(child.material) ? child.material : [child.material];
              mats.forEach((mat, idx) => {
                if (!mat) return;

                // Glass Plane (Material.003 / Screen / Photo) -> Live Video Stream
                if (mat.name === 'Material.003' || mat.name === 'Screen' || mat.name === 'Photo' || mat.name === 'Display') {
                  const geom = child.geometry;
                  if (geom && geom.attributes.position && geom.attributes.uv) {
                    const pos = geom.attributes.position;
                    const uvs = geom.attributes.uv;
                    // Fallback quad UV initialization only if vertices are collapsed
                    if (pos.count === 4 && (uvs.getX(0) === uvs.getX(1) && uvs.getY(0) === uvs.getY(1))) {
                      uvs.setXY(0, 0, 1);
                      uvs.setXY(1, 0, 0);
                      uvs.setXY(2, 1, 1);
                      uvs.setXY(3, 1, 0);
                      uvs.needsUpdate = true;
                    }
                  }

                  const videoMat = new THREE.MeshBasicMaterial({
                    map: this.videoTexture,
                    transparent: false,
                    opacity: 1.0,
                    side: THREE.DoubleSide
                  });

                  if (Array.isArray(child.material)) {
                    child.material[idx] = videoMat;
                  } else {
                    child.material = videoMat;
                  }
                }
                // Do NOT touch other materials! Poliigon_CeramicPotteryGlazed and
                // CityStreetAsphaltGenericClean keep their authored textures, normals, and gloss!
              });
            }
          });

          this.modelPivot.add(model);

          // Boost scale by ~35% for real tabletop presence
          this.modelPivot.scale.set(1.35, 1.35, 1.35);

          // Compute bounding box and normalize so lowest point sits flush at y = 0
          this.modelPivot.updateMatrixWorld(true);
          const box = new THREE.Box3().setFromObject(this.modelPivot);
          this.modelPivot.position.y = -box.min.y;

          this.frameGroup.add(this.modelPivot);

          // Add contact shadow plane flush at y = 0.001
          this.addContactShadow();

          this.modelLoaded = true;
        }, undefined, (err) => {
          console.error('[Kipakosa AR] Error loading 3D frame:', err);
        });
      },

      addContactShadow: function() {
        const shadowGeo = new THREE.PlaneGeometry(0.52, 0.52);
        shadowGeo.rotateX(-Math.PI / 2);

        const canvas = document.createElement('canvas');
        canvas.width = 128; canvas.height = 128;
        const ctx = canvas.getContext('2d');
        const grad = ctx.createRadialGradient(64, 64, 10, 64, 64, 60);
        grad.addColorStop(0, 'rgba(0, 0, 0, 0.65)');
        grad.addColorStop(0.5, 'rgba(0, 0, 0, 0.25)');
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 128, 128);

        const shadowTex = new THREE.CanvasTexture(canvas);
        const shadowMat = new THREE.MeshBasicMaterial({
          map: shadowTex,
          transparent: true,
          opacity: 0.75,
          depthWrite: false
        });
        const shadowMesh = new THREE.Mesh(shadowGeo, shadowMat);
        shadowMesh.position.y = 0.001;
        this.frameGroup.add(shadowMesh);
      },

      // Official Raycaster Ground Tap Handler
      onGroundClick: function(e) {
        if (this.placed) return;

        // Ensure intersection point is valid on ground
        let point = null;
        if (e && e.detail && e.detail.intersection && e.detail.intersection.point) {
          point = e.detail.intersection.point;
        } else if (this.reticleEl && this.reticleEl.object3D.visible) {
          point = this.reticleEl.object3D.position;
        }

        if (!point) return;

        // Place frame directly on the ground plane at y = 0
        this.frameGroup.position.set(point.x, 0, point.z);

        // Orient container to face camera horizontally
        const camera = this.el.sceneEl.camera;
        if (camera) {
          const camPos = new THREE.Vector3();
          camera.getWorldPosition(camPos);
          this.frameGroup.lookAt(camPos.x, 0, camPos.z);
        }

        this.frameGroup.visible = true;
        this.placed = true;

        // Hide ground reticle and instruction card
        if (this.reticleEl) this.reticleEl.setAttribute('visible', 'false');
        const overlay = document.getElementById('placement-overlay');
        const controls = document.getElementById('placed-controls');
        if (overlay) overlay.classList.add('placed');
        if (controls) controls.style.display = 'flex';

        // Haptic buzz confirmation
        if (navigator.vibrate) navigator.vibrate([35, 45, 35]);

        // UNMUTE AND PLAY IMMEDIATELY on this user gesture tap
        this.video.muted = false;
        const playPromise = this.video.play();
        if (playPromise && playPromise.catch) {
          playPromise.then(() => {
            this.isMuted = false;
            this.updateSoundPill();
          }).catch((err) => {
            console.warn('[Kipakosa AR] Unmuted playback blocked, playing muted fallback:', err);
            this.video.muted = true;
            this.video.play().catch(() => {});
            this.isMuted = true;
            this.updateSoundPill();
          });
        }
      },

      reposition: function() {
        this.placed = false;
        this.frameGroup.visible = false;
        if (this.reticleEl) this.reticleEl.setAttribute('visible', 'true');

        const overlay = document.getElementById('placement-overlay');
        const controls = document.getElementById('placed-controls');
        if (overlay) overlay.classList.remove('placed');
        if (controls) controls.style.display = 'none';
      },

      toggleAudio: function() {
        if (!this.video) return false;
        this.video.muted = !this.video.muted;
        this.isMuted = this.video.muted;
        this.updateSoundPill();
        return !this.isMuted;
      },

      updateSoundPill: function() {
        const soundPill = document.getElementById('sound-pill');
        if (soundPill) {
          if (this.isMuted) {
            soundPill.classList.add('muted');
            soundPill.innerHTML = '<span>🔇 Muted</span>';
          } else {
            soundPill.classList.remove('muted');
            soundPill.innerHTML = '<span>🔊 Sound On</span>';
          }
        }
      }
    });

    // ── Official Ground Raycasting Reticle Component ──
    AFRAME.registerComponent('ground-reticle-tracker', {
      init: function() {
        this.groundEl = document.getElementById('ground');
        this.cameraEl = document.getElementById('camera');
      },
      tick: function() {
        const frameEl = document.getElementById('living-frame');
        const isPlaced = frameEl && frameEl.components['tabletop-living-frame'] && frameEl.components['tabletop-living-frame'].placed;
        if (isPlaced) {
          this.el.object3D.visible = false;
          return;
        }

        // Check camera raycaster intersection with ground plane
        if (this.cameraEl && this.cameraEl.components.raycaster) {
          const raycaster = this.cameraEl.components.raycaster;
          const intersection = raycaster.getIntersection(this.groundEl);
          if (intersection && intersection.point) {
            this.el.object3D.position.set(intersection.point.x, 0.005, intersection.point.z);
            this.el.object3D.visible = true;
            return;
          }
        }

        // Fallback: project ray 0.85m ahead onto ground plane y = 0
        if (this.cameraEl && this.cameraEl.object3D) {
          const cam = this.cameraEl.object3D;
          const dir = new THREE.Vector3();
          cam.getWorldDirection(dir);
          const pos = new THREE.Vector3();
          cam.getWorldPosition(pos);

          // If looking downwards towards the ground plane
          if (dir.y < -0.05) {
            const t = -pos.y / dir.y;
            if (t > 0.2 && t < 10) {
              const groundX = pos.x + dir.x * t;
              const groundZ = pos.z + dir.z * t;
              this.el.object3D.position.set(groundX, 0.005, groundZ);
              this.el.object3D.visible = true;
              return;
            }
          }
        }
      }
    });

    // Global action helpers
    window.resetPlacement = function() {
      const el = document.getElementById('living-frame');
      if (el && el.components['tabletop-living-frame']) {
        el.components['tabletop-living-frame'].reposition();
      }
    };

    window.toggleSound = function() {
      const el = document.getElementById('living-frame');
      if (el && el.components['tabletop-living-frame']) {
        el.components['tabletop-living-frame'].toggleAudio();
      }
    };
  </script>
</head>
<body>

  <!-- Watermark Badge -->
  <div id="ar-watermark">
    <img src="/assets/logo.svg" alt="Logo" />
    <span>Kipakosa<span>AR</span></span>
  </div>

  <!-- Top Action Bar -->
  <div id="top-actions">
    <button id="sound-pill" class="header-pill" onclick="toggleSound()">
      <span>🔊 Sound On</span>
    </button>
    <a id="back-pill" class="header-pill" href="/landing#demo">
      <span>← Back</span>
    </a>
  </div>

  <!-- Branded Starting AR Camera Overlay -->
  <div id="camera-loading">
    <div class="camera-pulse-ring"></div>
    <div class="camera-loading-text">Starting AR Camera...</div>
  </div>

  <!-- Pre-placement Cue Overlay -->
  <div id="placement-overlay">
    <div class="instruction-card">
      <h3 class="instruction-title">Place Living Frame</h3>
      <p class="instruction-sub">Aim at a table or flat desk surface, then <strong>tap screen</strong> to place your frame.</p>
    </div>
  </div>

  <!-- Post-placement Single Clean Action Pill -->
  <div id="placed-controls">
    <button class="ar-reposition-btn" onclick="resetPlacement()">
      <span>↺ Reposition</span>
    </button>
  </div>

  <!-- 8th Wall SLAM Scene with Official Gesture Detector -->
  <a-scene
    xrextras-gesture-detector
    xrextras-loading
    xrextras-runtime-error
    renderer="colorManagement:true;alpha:true;antialias:true"
    xrweb="allowedDevices: any">

    <!-- Camera configured with Official 8th Wall Ground Raycaster targeting .cantap -->
    <a-camera
      id="camera"
      position="0 1.2 0"
      raycaster="objects: .cantap"
      cursor="fuse: false; rayOrigin: mouse;">
    </a-camera>

    <!-- PBR Ambient & Directional Scene Lighting -->
    <a-entity light="type: ambient; color: #ffffff; intensity: 1.2"></a-entity>
    <a-entity light="type: directional; color: #fff8e8; intensity: 1.6; castShadow: true" position="1 4 2"></a-entity>

    <!-- Official Full-Room Transparent Ground Plane (y = 0) -->
    <a-entity
      id="ground"
      class="cantap"
      geometry="primitive: box; width: 1000; height: 0.001; depth: 1000"
      position="0 0 0"
      material="opacity: 0; transparent: true">
    </a-entity>

    <!-- 3D Surface Reticle tracking Ground Plane raycast -->
    <a-entity id="ground-reticle" ground-reticle-tracker visible="false">
      <!-- Outer smooth golden ring -->
      <a-ring color="#c9a96e" radius-inner="0.10" radius-outer="0.12" rotation="-90 0 0" material="side: double; transparent: true; opacity: 0.85"></a-ring>
      <!-- Center target dot -->
      <a-circle color="#ffffff" radius="0.02" rotation="-90 0 0" material="side: double; transparent: true; opacity: 0.95"></a-circle>
    </a-entity>

    <!-- Living Frame Entity with Official 8th Wall Gestures (1-finger rotate, pinch scale, drag) -->
    <a-entity
      id="living-frame"
      class="cantap"
      tabletop-living-frame
      xrextras-one-finger-rotate="factor: 6"
      xrextras-two-finger-rotate="factor: 5"
      xrextras-pinch-scale="min: 0.4; max: 2.5"
      xrextras-hold-drag>
    </a-entity>

  </a-scene>

</body>
</html>
