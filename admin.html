<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Login — Kipakosa AR</title>
  <link rel="stylesheet" href="css/app.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #090d16; }
    .login-card { background: var(--surface-card); border: 1.5px solid var(--border); border-radius: 14px; padding: 36px 32px; width: 100%; max-width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .brand { font-size: 20px; font-weight: 800; margin-bottom: 24px; display: flex; align-items: center; gap: 8px; color: var(--text); }
    .brand span { font-size: 11px; background: var(--accent-gradient); color: #fff; padding: 2px 7px; border-radius: 4px; font-weight: 700; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="brand" style="justify-content:center;margin-bottom:28px">
    <img src="/assets/logo.svg" style="width:36px;height:36px;border-radius:8px;margin-right:4px" />
    Kipakosa <span>ADMIN</span>
  </div>
  <form id="login-form">

    <div class="form-group">
      <label>Admin Email</label>
      <input class="form-control" type="email" id="email" placeholder="admin@example.com" required autofocus />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input class="form-control" type="password" id="pw" placeholder="Enter your password" required />
    </div>
    <div id="err-msg" style="color:var(--red);font-size:13px;font-weight:600;margin-bottom:14px;display:none">Incorrect email or password</div>
    <button type="submit" class="btn btn-primary" style="width:100%" id="login-btn">Log In</button>
  </form>
</div>


<script type="module">
  import { getSupabase, login } from './js/auth.js';

  try {
    const sb = await getSupabase();
    const { data } = await sb.auth.getSession();
    if (data?.session) window.location.replace('/dashboard.html');
    if (window.__kipakosaAdminEmail) {
      document.getElementById('email').value = window.__kipakosaAdminEmail;
      document.getElementById('pw').focus();
    }
  } catch (err) {
    document.getElementById('err-msg').textContent = 'Auth unavailable: ' + err.message;
    document.getElementById('err-msg').style.display = 'block';
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    btn.disabled = true;
    try {
      await login(document.getElementById('email').value.trim(), document.getElementById('pw').value);
      window.location.replace('/dashboard.html');
    } catch {
      document.getElementById('err-msg').style.display = 'block';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
