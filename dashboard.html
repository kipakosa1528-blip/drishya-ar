<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Dashboard — Drishya AR</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-brand">Drishya <span>AR</span></div>
    <a class="nav-link" data-page="dashboard" href="dashboard.html">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Dashboard
    </a>
    <a class="nav-link" data-page="projects" href="projects.html">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg>
      Projects
    </a>
    <a class="nav-link" data-page="create" href="create.html">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      New Project
    </a>
    <div class="sidebar-footer">
      <button class="btn btn-sm btn-default" id="logout-btn" style="width:100%">Logout</button>
    </div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div class="page-title">Dashboard Overview</div>
      <a href="create.html" class="btn btn-primary">+ New Project</a>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-lbl">Total Projects</div><div class="stat-val" id="st-total">0</div></div>
      <div class="stat-card"><div class="stat-lbl">Active Projects</div><div class="stat-val" style="color:var(--green)" id="st-active">0</div></div>
      <div class="stat-card"><div class="stat-lbl">Expired Projects</div><div class="stat-val" style="color:var(--red)" id="st-expired">0</div></div>
    </div>

    <div class="panel">
      <div class="panel-title" style="display:flex;justify-content:space-between;align-items:center">
        <span>Recent Projects</span>
        <a href="projects.html" style="font-size:12px;color:var(--accent)">View all →</a>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:70px">Image</th>
              <th>Project</th>
              <th>Client</th>
              <th>Status</th>
              <th>Expires</th>
              <th style="text-align:right;width:140px">Actions</th>
            </tr>
          </thead>
          <tbody id="recent-body">
            <tr><td colspan="6" class="empty">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script type="module">
  import { requireAuth, initNav } from './js/auth.js?v=2';
  import { getAllProjects, deleteProject, deleteFiles } from './js/db.js?v=2';
  import { fmt, isExpired, statusBadge, toast } from './js/utils.js?v=2';

  requireAuth(); 
  initNav('dashboard');

  let projects = await getAllProjects();
  projects.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));

  const total = projects.length;
  const expired = projects.filter(p => isExpired(p.expiresAt)).length;
  const active = total - expired;

  document.getElementById('st-total').textContent   = total;
  document.getElementById('st-active').textContent  = active;
  document.getElementById('st-expired').textContent = expired;

  renderRecent();

  function renderRecent() {
    const recent = projects.slice(0, 5);
    const body = document.getElementById('recent-body');
    if (!recent.length) {
      body.innerHTML = `<tr><td colspan="6" class="empty">No projects yet. <a href="create.html">Create one</a></td></tr>`;
      return;
    }
    body.innerHTML = recent.map(p => `
      <tr>
        <td style="width:70px">
          ${p.imageUrl ? `<img class="td-thumb" src="${p.imageUrl}" />` : `<div class="td-thumb-placeholder"></div>`}
        </td>
        <td><a href="project.html?id=${p.id}" style="font-weight:500">${p.name}</a></td>
        <td style="color:var(--muted)">${p.client || '—'}</td>
        <td>${statusBadge(p.expiresAt)}</td>
        <td style="color:var(--muted)">${fmt(p.expiresAt)}</td>
        <td style="text-align:right">
          <div class="actions" style="justify-content:flex-end">
            <a href="project.html?id=${p.id}" class="btn btn-sm btn-default">View</a>
            <button class="btn btn-sm btn-danger" onclick="delProj('${p.id}', '${p.name.replace(/'/g, "\\'")}')">Delete</button>
          </div>
        </td>
      </tr>`).join('');
  }

  window.delProj = async function(id, name) {
    if (confirm(`Delete "${name}"?`)) {
      await deleteProject(id);
      await deleteFiles(id);
      projects = projects.filter(p => p.id !== id);
      renderRecent();
      toast('Project deleted');
    }
  };
</script>
</body>
</html>
