<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Dashboard — Kipakosa AR</title>
  <link rel="stylesheet" href="css/app.css?v=3" />
  <script src="js/admin-boot.js?v=1"></script>
</head>
<body>
<div class="mobile-topbar">
  <div class="brand"><img src="/assets/logo.svg" style="width:24px;height:24px;border-radius:6px;margin-right:8px;vertical-align:middle" />Kipakosa <span>AR</span></div>
  <button class="btn btn-sm btn-default logout-btn">Logout</button>
</div>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-brand" style="display:flex;align-items:center;gap:10px">
      <img src="/assets/logo.svg" style="width:28px;height:28px;border-radius:6px" />
      <div>Kipakosa <span>AR</span></div>
    </div>

    <a class="nav-link" data-page="dashboard" href="dashboard.html">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Dashboard
    </a>
    <a class="nav-link" data-page="projects" href="projects.html">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg>
      Projects
    </a>
    <a class="nav-link" data-page="create" href="create.html">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      New Project
    </a>
    <div class="sidebar-footer">
      <button class="btn btn-sm btn-default" id="logout-btn" style="width:100%">Logout</button>
    </div>
  </aside>

  <main class="main">

    <div class="page-header">
      <div class="page-title">Dashboard Overview</div>
      <a href="create.html" class="btn btn-primary">+ New Project</a>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-lbl">Total Projects</div><div class="stat-val" id="st-total">&nbsp;</div></div>
      <div class="stat-card"><div class="stat-lbl">Total AR Scans</div><div class="stat-val" style="color:var(--accent)" id="st-scans">&nbsp;</div></div>
      <div class="stat-card"><div class="stat-lbl">Active Projects</div><div class="stat-val" style="color:var(--green)" id="st-active">&nbsp;</div></div>
      <div class="stat-card"><div class="stat-lbl">Expired Projects</div><div class="stat-val" style="color:var(--red)" id="st-expired">&nbsp;</div></div>
    </div>

    <div class="panel">
      <div class="panel-title" style="display:flex;justify-content:space-between;align-items:center">
        <span>Recent Projects</span>
        <a href="projects.html" style="font-size:12px;color:var(--accent)">View all →</a>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:70px">Image</th>
              <th>Project</th>
              <th>Client</th>
              <th>Scans</th>
              <th>Status</th>
              <th>Expires</th>
              <th style="text-align:right;width:140px">Actions</th>
            </tr>
          </thead>
<tbody id="recent-body"></tbody>
        </table>
      </div>

      <script>
        (function () {
          var list = KBoot.readCache();
          var body = document.getElementById('recent-body');
          if (!list) { body.innerHTML = KBoot.skeletonRows(4); return; }
          var expired = 0, scans = 0;
          list.forEach(function (p) {
            if (KBoot.isExpired(p)) expired++;
            scans += Number(p.viewsCount || p.views_count || 0);
          });
          KBoot.setText('st-total', list.length);
          KBoot.setText('st-scans', scans);
          KBoot.setText('st-active', list.length - expired);
          KBoot.setText('st-expired', expired);
          var recent = list.slice().sort(KBoot.byCreatedDesc).slice(0, 5);
          body.innerHTML = recent.length ? recent.map(KBoot.rowHTML).join('')
            : '<tr><td colspan="7" class="empty">No projects yet. <a href="create.html" style="color:var(--accent);font-weight:600">Create one</a></td></tr>';
        })();
      </script>
    </div>
  </main>
</div>

<script type="module">
  import { requireAuth, initNav } from './js/auth.js?v=4';
  import { getAllProjects, deleteProject } from './js/db.js?v=4';
  import { fmt, isExpired, statusBadge, toast } from './js/utils.js?v=3';

  requireAuth(); 
  initNav('dashboard');

  function updateDashboard(list) {
    projects = (list || []).sort((a,b) => new Date(b.createdAt || b.created_at) - new Date(a.createdAt || a.created_at));
    const total = projects.length;
    const expired = projects.filter(p => isExpired(p)).length;
    const active = total - expired;
    const totalScans = projects.reduce((acc, p) => acc + (p.viewsCount || p.views_count || 0), 0);

    document.getElementById('st-total').textContent   = total;
    document.getElementById('st-scans').textContent   = totalScans;
    document.getElementById('st-active').textContent  = active;
    document.getElementById('st-expired').textContent = expired;
    renderRecent();
  }

  let projects = [];
  const initial = await getAllProjects((freshList) => {
    updateDashboard(freshList);
  });
  updateDashboard(initial);

  function renderRecent() {
    const recent = projects.slice(0, 5);
    const body = document.getElementById('recent-body');
    if (!recent.length) {
      body.innerHTML = `<tr><td colspan="7" class="empty">No projects yet. <a href="create.html" style="color:var(--accent);font-weight:600">Create one</a></td></tr>`;
      return;
    }
    body.innerHTML = recent.map(p => `
      <tr>
        <td style="width:70px">
          ${p.imageUrl ? `<img class="td-thumb" src="${p.imageUrl}" />` : `<div class="td-thumb-placeholder"></div>`}
        </td>
        <td><a href="project.html?id=${p.id}" style="font-weight:600;color:var(--text)">${p.name}</a></td>
        <td style="color:var(--text-secondary)">${p.client || '—'}</td>
        <td><span style="display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--accent)"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> ${p.viewsCount || p.views_count || 0}</span></td>
        <td>${statusBadge(p)}</td>
        <td style="color:var(--text-secondary)">${fmt(p.expiresAt || p.expires_at)}</td>

        <td style="text-align:right">
          <div class="actions" style="display:flex;gap:6px;justify-content:flex-end">
            <a href="project.html?id=${p.id}" class="btn btn-sm btn-default">View</a>
            <button class="btn btn-sm btn-danger" onclick="delProj('${p.id}', '${p.name.replace(/'/g, "\\'")}')">Delete</button>
          </div>
        </td>
      </tr>`).join('');
  }


  window.delProj = async function(id, name) {
    if (confirm(`Delete "${name}"?`)) {
      await deleteProject(id);
      projects = projects.filter(p => p.id !== id);
      updateDashboard(projects);
      toast('Project deleted', 'success');
    }
  };
</script>

</body>
</html>
