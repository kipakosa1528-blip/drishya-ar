  <style>
    :root {
      --bg: #07090e;
      --card: #0f141f;
      --border: rgba(255, 255, 255, 0.1);
      --gold: #C9A96E;
      --text: #ffffff;
      --muted: #8c96a8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px 60px;
    }
    .bio-container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }
    .bio-avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      padding: 4px;
      background: #000;
      margin: 0 auto 16px;
      display: block;
    }
    .bio-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    .bio-tagline {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 32px;
    }
    .bio-links-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 40px;
    }
    .bio-link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .bio-link-btn:hover {
      border-color: var(--gold);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(201, 169, 110, 0.2);
    }
    .bio-btn-gold {
      background: linear-gradient(135deg, #d4af37 0%, #aa820a 100%);
      color: #000;
      border: none;
      font-weight: 700;
    }
    .bio-btn-gold:hover {
      box-shadow: 0 8px 30px rgba(212, 175, 55, 0.4);
    }
    .bio-socials {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-bottom: 40px;
    }
    .bio-social-icon {
      color: var(--muted);
      transition: color 0.2s;
    }
    .bio-social-icon:hover {
      color: var(--gold);
    }
    .bio-footer {
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
