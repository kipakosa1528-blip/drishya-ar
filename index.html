<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Login — Kipakosa AR</title>
  <link rel="stylesheet" href="css/app.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #09090b; }
    .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 32px; width: 100%; max-width: 360px; }
    .brand { font-size: 16px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 6px; }
    .brand span { font-size: 10px; background: rgba(99,102,241,.15); color: var(--accent); padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="brand">Kipakosa <span>ADMIN</span></div>
  <form id="login-form">
    <div class="form-group">
      <label>Admin Password</label>
      <input class="form-control" type="password" id="pw" placeholder="Enter admin password" required autofocus />
    </div>
    <div id="err-msg" style="color:var(--red);font-size:12px;margin-bottom:12px;display:none">Incorrect password</div>
    <button type="submit" class="btn btn-primary" style="width:100%" id="login-btn">Log In</button>
  </form>
</div>

<script type="module">
  import { isLoggedIn, login } from './js/auth.js';
  if (isLoggedIn()) window.location.replace('/dashboard.html');

  document.getElementById('login-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const pw = document.getElementById('pw').value;
    if (login(pw)) {
      window.location.replace('/dashboard.html');
    } else {
      document.getElementById('err-msg').style.display = 'block';
    }
  });
</script>
</body>
</html>
